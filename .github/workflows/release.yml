# Builds the desktop versions and attaches them to a release. The Android APKs are signed with
# the release key, so they're built and uploaded by hand when creating the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - run: flutter build linux --release
      - name: Package
        run: |
          mv build/linux/x64/release/bundle shu
          tar -czf shu-${{ github.event.release.tag_name }}-linux-x64.tar.gz shu
      - run: gh release upload ${{ github.event.release.tag_name }} shu-*-linux-x64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter build windows --release
      - name: Package
        run: |
          Move-Item build\windows\x64\runner\Release Shu
          Compress-Archive -Path Shu -DestinationPath shu-${{ github.event.release.tag_name }}-windows-x64.zip
      - run: gh release upload ${{ github.event.release.tag_name }} (Get-Item shu-*-windows-x64.zip).Name
        env:
          GH_TOKEN: ${{ github.token }}
