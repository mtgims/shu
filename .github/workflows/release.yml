# Builds every version and attaches it to a release. The names carry no version so the README
# and the in-app updater can link to releases/latest/download/<name>.
#
# The APKs are signed with the release key from two repository secrets: ANDROID_KEYSTORE (the
# .jks file, base64) and ANDROID_KEY_PROPERTIES (the android/key.properties text; its storeFile
# line is replaced here).
name: Release

on:
  release:
    types: [published]
  # Builds the AppImage again for a release made before its job existed (or after a fix to it).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the AppImage of
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          # Without the key Gradle signs with a debug key, and installed copies couldn't update.
          if [ -z "$KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::ANDROID_KEYSTORE or ANDROID_KEY_PROPERTIES secret is missing"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shu-release.jks"
          {
            grep -v '^storeFile=' <<<"$KEY_PROPERTIES"
            echo "storeFile=$RUNNER_TEMP/shu-release.jks"
          } > android/key.properties
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Package
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk shu-android-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk shu-android-armeabi-v7a.apk
      - run: >
          gh release upload ${{ github.event.release.tag_name }}
          build/app/outputs/flutter-apk/shu-android-arm64-v8a.apk
          build/app/outputs/flutter-apk/shu-android-armeabi-v7a.apk
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - run: flutter build linux --release
      - name: Package
        run: |
          mv build/linux/x64/release/bundle shu
          tar -czf shu-linux-x64.tar.gz shu
      - run: gh release upload ${{ github.event.release.tag_name }} shu-linux-x64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter build windows --release
      - name: Package
        run: |
          Move-Item build\windows\x64\runner\Release Shu
          Compress-Archive -Path Shu -DestinationPath shu-windows-x64.zip
      - run: gh release upload ${{ github.event.release.tag_name }} shu-windows-x64.zip
        env:
          GH_TOKEN: ${{ github.token }}

  # A single file that runs on most Linux distributions, with libmpv and GTK packed in.
  appimage:
    runs-on: ubuntu-22.04 # the oldest glibc still built on, so it runs on older systems too
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: >
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config
          libgtk-3-dev libmpv-dev patchelf file
      - run: flutter build linux --release
      - name: AppDir
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runners
          DEPLOY_GTK_VERSION: 3
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLo linuxdeploy-plugin-gtk.sh "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          # Flutter's bundle stays whole: the app looks for lib/ and data/ beside itself.
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/. AppDir/usr/bin/
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/shu \
            --library "$(ldconfig -p | grep -m1 -o '/[^ ]*libmpv.so.[12]')" \
            --desktop-file linux/appimage/shu.desktop \
            --icon-file linux/runner/resources/shu.png \
            --custom-apprun linux/appimage/AppRun \
            --plugin gtk
          # media_kit opens libmpv by name from Dart, so the search path that counts is the
          # Flutter engine's own: point it at the packed libraries.
          patchelf --set-rpath '$ORIGIN:$ORIGIN/../../lib' AppDir/usr/bin/lib/libflutter_linux_gtk.so
          # Without libmpv the AppImage would start but never play.
          test -n "$(find AppDir/usr/lib -name 'libmpv.so*')"
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool AppDir shu-linux-x86_64.AppImage
      - run: gh release upload "$TAG" shu-linux-x86_64.AppImage --clobber
        env:
          GH_TOKEN: ${{ github.token }}
