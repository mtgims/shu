# Builds every version and attaches it to a release. The names carry no version so the README
# and the in-app updater can link to releases/latest/download/<name>.
#
# The APKs are signed with the release key from two repository secrets: ANDROID_KEYSTORE (the
# .jks file, base64) and ANDROID_KEY_PROPERTIES (the android/key.properties text; its storeFile
# line is replaced here).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          # Without the key Gradle signs with a debug key, and installed copies couldn't update.
          if [ -z "$KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::ANDROID_KEYSTORE or ANDROID_KEY_PROPERTIES secret is missing"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shu-release.jks"
          {
            grep -v '^storeFile=' <<<"$KEY_PROPERTIES"
            echo "storeFile=$RUNNER_TEMP/shu-release.jks"
          } > android/key.properties
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Package
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk shu-android-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk shu-android-armeabi-v7a.apk
      - run: >
          gh release upload ${{ github.event.release.tag_name }}
          build/app/outputs/flutter-apk/shu-android-arm64-v8a.apk
          build/app/outputs/flutter-apk/shu-android-armeabi-v7a.apk
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - run: flutter build linux --release
      - name: Package
        run: |
          mv build/linux/x64/release/bundle shu
          tar -czf shu-linux-x64.tar.gz shu
      - run: gh release upload ${{ github.event.release.tag_name }} shu-linux-x64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true
      - run: flutter build windows --release
      - name: Package
        run: |
          Move-Item build\windows\x64\runner\Release Shu
          Compress-Archive -Path Shu -DestinationPath shu-windows-x64.zip
      - run: gh release upload ${{ github.event.release.tag_name }} shu-windows-x64.zip
        env:
          GH_TOKEN: ${{ github.token }}
